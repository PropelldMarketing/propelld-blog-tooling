name: Manual script run

on:
  workflow_dispatch:
    inputs:
      script:
        description: 'Which script to run'
        required: true
        type: choice
        options:
          # Read-only diagnostics (safe defaults, run first)
          - audit_internal_links
          - check_url_health
          - check_facet_content
          - link_health_report
          # Refiners (produce CSVs for review, no site changes)
          - link_recommender
          - generate_anchor_variants
          - triage_review_links
          - anchor_refiner
          - refine_audit_rewrites
          - preview_link_insertions
          - insert_planned_links
          - preview_insertion_plans
          - plan_insertions
          - priority_scorer
          # Direct writes to Webflow (require snapshot + --apply)
          - bulk_apply_audit
          - bulk_apply_links
          - refresh_hub_data
          - refresh_links
          - snapshot
          - publish_facet_items
          # Rollback / recovery
          - rollback
          - rollback_audit_rewrites
      apply:
        description: 'Run with --apply (actually write changes). Defaults to dry-run.'
        required: false
        type: boolean
        default: false
      extra_args:
        description: 'Extra CLI args to pass to the script (optional)'
        required: false
        type: string
      snapshot_run_id:
        description: 'Run ID of a previous run whose snapshot artifact to restore into the workspace (for rollback - find it in the run URL)'
        required: false
        type: string

permissions:
  contents: write
  actions: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Restore snapshot artifact from previous run (optional)
        if: inputs.snapshot_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Downloading artifacts of run ${{ inputs.snapshot_run_id }}..."
          gh run download ${{ inputs.snapshot_run_id }} --repo ${{ github.repository }} --dir _restore
          mkdir -p snapshots restore-log
          # artifact layout: _restore/<artifact-name>/{snapshots,out}/...
          cp -r _restore/*/snapshots/* snapshots/ 2>/dev/null || true
          cp -r _restore/*/out/* restore-log/ 2>/dev/null || true
          echo "Restored snapshot folders:"; ls snapshots/
          echo "Restored logs:"; ls restore-log/ || true

      - name: Run ${{ inputs.script }}
        env:
          WEBFLOW_API_TOKEN: ${{ secrets.WEBFLOW_API_TOKEN }}
          AHREFS_API_TOKEN: ${{ secrets.AHREFS_API_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          ARGS=""
          if [ "${{ inputs.apply }}" = "true" ]; then ARGS="--apply"; fi
          if [ -n "${{ inputs.extra_args }}" ]; then ARGS="$ARGS ${{ inputs.extra_args }}"; fi
          echo "FINAL ARGS: $ARGS"
          python scripts/${{ inputs.script }}.py $ARGS

      - name: Commit generated anchor library back to repo
        if: inputs.script == 'generate_anchor_variants' && inputs.apply
        run: |
          if ! git diff --quiet -- data/anchor_library_full.json 2>/dev/null || \
             [ -n "$(git status --porcelain data/anchor_library_full.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/anchor_library_full.json
            git commit -m "Auto-generate expanded anchor library (${{ github.run_id }})"
            git push
          else
            echo "No changes to anchor library."
          fi

      - name: Upload any output artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.script }}-${{ github.run_id }}
          path: |
            out/
            snapshots/
          if-no-files-found: ignore
          retention-days: 30
